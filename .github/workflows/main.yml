name: RDP Setup and Software Installation

on:
  workflow_dispatch:

jobs:
  setup-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force  
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Fixed Password
        run: |
          $password = 'Zain.rty123'
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name "Administrator" -ErrorAction SilentlyContinue) {
              Set-LocalUser -Name "Administrator" -Password $securePass
          } else {
              New-LocalUser -Name "Administrator" -Password $securePass -AccountNeverExpires
          }

          Add-LocalGroupMember -Group "Administrators" -Member "Administrator" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "Administrator" -ErrorAction SilentlyContinue

          echo "RDP_CREDS=User: Administrator | Password: $password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          $authKey = "${{ secrets.TAILSCALE_AUTH_KEY }}"
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=$authKey --hostname=gh-runner-$env:GITHUB_RUN_ID

          $tsIP = $null
          for ($i=0; $i -lt 10 -and -not $tsIP; $i++) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep 5
          }
          if (-not $tsIP) { exit 1 }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389

      - name: Download, Extract, and Copy sOFTWARES to REAL Administrator Desktop
        run: |
          Write-Host "=== DETECTING ADMINISTRATOR DESKTOPS ==="

          # Detect Administrator desktops including shadow profiles
          $desktopTargets = @()
          $profiles = Get-ChildItem "C:\Users" -Directory | Where-Object {
            $_.Name -eq "Administrator" -or $_.Name -like "Administrator.*"
          }

          foreach ($prof in $profiles) {
            $desk = Join-Path $prof.FullName "Desktop"
            if (!(Test-Path $desk)) {
              New-Item -ItemType Directory -Force -Path $desk | Out-Null
            }
            Write-Host "[+] Found Administrator desktop: $desk"
            $desktopTargets += $desk
          }

          if ($desktopTargets.Count -eq 0) {
            Write-Error "NO Administrator desktop found. Something is wrong."
            exit 1
          }

          Write-Host "=== ADMIN DESKTOP TARGETS ==="
          $desktopTargets | ForEach-Object { Write-Host " --> $_" }

          # Prepare download/extract
          $downloadUrl = "https://github.com/Zaiinalii/RDP/releases/download/v1/sOFTWARES.rar"
          $downloadPath = "$env:TEMP\sOFTWARES.rar"
          $extractPath = "$env:TEMP\sOFTWARES_extracted"

          Invoke-WebRequest -Uri $downloadUrl -OutFile $downloadPath -UseBasicParsing

          # Ensure 7zip exists
          $sevenZipCandidates = @(
            "C:\Program Files\7-Zip\7z.exe",
            "C:\Program Files (x86)\7-Zip\7z.exe"
          )
          $sevenZip = $sevenZipCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $sevenZip) {
            choco install 7zip -y
            $sevenZip = $sevenZipCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }

          if (-not $sevenZip) {
            Write-Error "7-Zip could not be installed."
            exit 1
          }

          # Extract
          if (Test-Path $extractPath) { Remove-Item $extractPath -Recurse -Force }
          New-Item -ItemType Directory -Path $extractPath | Out-Null
          & "$sevenZip" x "$downloadPath" "-o$extractPath" -y

          Write-Host "=== COPYING TO ALL ADMINISTRATOR DESKTOPS ==="
          foreach ($desk in $desktopTargets) {
            Write-Host "Copying files to: $desk"
            Copy-Item "$extractPath\*" -Destination $desk -Recurse -Force
          }

          Write-Host "[✔] All files copied to all Administrator desktops."

      - name: Maintain RDP Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: Administrator"
          Write-Host "Password: $env:RDP_CREDS"
          Write-Host "==================`n"

          while ($true) {
              Start-Sleep -Seconds 300
          }
