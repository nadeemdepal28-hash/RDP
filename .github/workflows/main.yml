name: RDP Setup and Software Installation

on:
  workflow_dispatch:

jobs:
  setup-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force  
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Fixed Password
        run: |
          $password = 'Zain.rty123'
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name "Administrator" -ErrorAction SilentlyContinue) {
              Set-LocalUser -Name "Administrator" -Password $securePass
          } else {
              New-LocalUser -Name "Administrator" -Password $securePass -AccountNeverExpires
          }

          Add-LocalGroupMember -Group "Administrators" -Member "Administrator" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "Administrator" -ErrorAction SilentlyContinue

          echo "RDP_CREDS=User: Administrator | Password: $password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          $authKey = "${{ secrets.TAILSCALE_AUTH_KEY }}"
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=$authKey --hostname=gh-runner-$env:GITHUB_RUN_ID

          $tsIP = $null
          for ($i=0; $i -lt 10 -and -not $tsIP; $i++) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep 5
          }
          if (-not $tsIP) { exit 1 }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389

      - name: Download and Extract sOFTWARES (Force Copy to Administrator Desktop)
        run: |
          Write-Host "=== PREPARING ADMINISTRATOR PROFILE ==="

          # FORCE CREATE Administrator profile structure
          $adminRoot = "C:\Users\Administrator"
          $adminDesk = "C:\Users\Administrator\Desktop"

          New-Item -ItemType Directory -Force -Path $adminRoot | Out-Null
          New-Item -ItemType Directory -Force -Path $adminDesk | Out-Null
          New-Item -ItemType Directory -Force -Path "$adminRoot\Downloads" | Out-Null
          New-Item -ItemType Directory -Force -Path "$adminRoot\AppData\Roaming" -ErrorAction SilentlyContinue | Out-Null
          New-Item -ItemType Directory -Force -Path "$adminRoot\AppData\Local" -ErrorAction SilentlyContinue | Out-Null
          New-Item -ItemType Directory -Force -Path "$adminRoot\AppData\LocalLow" -ErrorAction SilentlyContinue | Out-Null

          Write-Host "[+] Administrator profile folders created."

          # Variables
          $downloadUrl = "https://github.com/Zaiinalii/RDP/releases/download/v1/sOFTWARES.rar"
          $downloadPath = "$env:TEMP\sOFTWARES.rar"
          $extractPath = "$env:TEMP\sOFTWARES_extracted"

          Invoke-WebRequest -Uri $downloadUrl -OutFile $downloadPath -UseBasicParsing

          # Ensure 7-Zip exists
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (!(Test-Path $sevenZip)) {
            choco install 7zip -y
          }

          if (!(Test-Path $sevenZip)) { 
            Write-Error "7-Zip failed to install."
            exit 1 
          }

          # Extract
          Remove-Item $extractPath -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $extractPath | Out-Null
          & "$sevenZip" x "$downloadPath" "-o$extractPath" -y

          Write-Host "=== COPYING FILES TO ADMINISTRATOR DESKTOP ==="

          Get-ChildItem $extractPath | ForEach-Object {
              $dest = Join-Path $adminDesk $_.Name
              if ($_.PSIsContainer) {
                  Copy-Item $_.FullName -Destination $dest -Recurse -Force
              } else {
                  Copy-Item $_.FullName -Destination $adminDesk -Force
              }
          }

          Write-Host "[✔] All files copied to:  C:\Users\Administrator\Desktop"

      - name: Maintain RDP Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: Administrator"
          Write-Host "Password: $env:RDP_CREDS"
          Write-Host "==================`n"

          while ($true) {
              Start-Sleep -Seconds 300
          }
